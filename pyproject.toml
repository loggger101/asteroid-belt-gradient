[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beltgradient"
dynamic = ["version"]
description = "Family-collapsed, completeness-debiased analysis of the asteroid belt's S/C compositional gradient (Edwards 2026)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Logan M. Edwards" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyarrow>=12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
belt-gradient = "beltgradient.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "beltgradient.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
filterwarnings = ["error"]   # a warning is a defect: it fails the test that raised it
markers = ["slow: full pipeline run against the committed results (needs data, ~1.5 min)"]
